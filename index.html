<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Ambarish">
  <meta name="copyright" content="© 2026 Ambarish. All rights reserved.">
  <title>LinguaCast — Broadcast Your Voice Worldwide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated Background -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="app">

    <!-- ===== Header ===== -->
    <header class="header">
      <div class="logo">
        <div class="logo-mark">📢</div>
        <div>
          <h1>Lingua<span>Cast</span></h1>
          <p class="tagline">Broadcast your voice worldwide</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <span class="theme-icon sun">☀️</span>
          <span class="theme-icon moon">🌙</span>
        </button>

        <div class="status-badge" id="connectionStatus">
          <span class="dot"></span>
          <span id="statusText">Checking...</span>
        </div>
      </div>
    </header>

    <!-- ===== Language Row ===== -->
    <div class="lang-row">
      <div class="lang-selector">
        <label>FROM</label>
        <select id="sourceLang">
          <option value="en-US" selected>🇺🇸 English</option>
          <option value="hi-IN">🇮🇳 Hindi</option>
          <option value="ta-IN">🇮🇳 Tamil</option>
          <option value="te-IN">🇮🇳 Telugu</option>
          <option value="bn-IN">🇮🇳 Bengali</option>
          <option value="ml-IN">🇮🇳 Malayalam</option>
          <option value="mr-IN">🇮🇳 Marathi</option>
          <option value="gu-IN">🇮🇳 Gujarati</option>
          <option value="kn-IN">🇮🇳 Kannada</option>
          <option value="pa-IN">🇮🇳 Punjabi</option>
          <option value="ur-PK">🇵🇰 Urdu</option>
          <option value="es-ES">🇪🇸 Spanish</option>
          <option value="fr-FR">🇫🇷 French</option>
          <option value="de-DE">🇩🇪 German</option>
          <option value="it-IT">🇮🇹 Italian</option>
          <option value="pt-BR">🇧🇷 Portuguese</option>
          <option value="ru-RU">🇷🇺 Russian</option>
          <option value="nl-NL">🇳🇱 Dutch</option>
          <option value="tr-TR">🇹🇷 Turkish</option>
          <option value="pl-PL">🇵🇱 Polish</option>
          <option value="sv-SE">🇸🇪 Swedish</option>
          <option value="ja-JP">🇯🇵 Japanese</option>
          <option value="ko-KR">🇰🇷 Korean</option>
          <option value="zh-CN">🇨🇳 Chinese</option>
          <option value="th-TH">🇹🇭 Thai</option>
          <option value="vi-VN">🇻🇳 Vietnamese</option>
          <option value="id-ID">🇮🇩 Indonesian</option>
          <option value="ar-SA">🇸🇦 Arabic</option>
          <option value="he-IL">🇮🇱 Hebrew</option>
          <option value="fa-IR">🇮🇷 Persian</option>
        </select>
      </div>

      <button class="swap-btn" id="swapBtn" title="Swap languages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4m0 0L3 8m4-4l4 4"/>
          <path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>
        </svg>
      </button>

      <div class="lang-selector">
        <label>TO</label>
        <select id="targetLang">
          <option value="hi-IN" selected>🇮🇳 Hindi</option>
          <option value="en-US">🇺🇸 English</option>
          <option value="ta-IN">🇮🇳 Tamil</option>
          <option value="te-IN">🇮🇳 Telugu</option>
          <option value="bn-IN">🇮🇳 Bengali</option>
          <option value="ml-IN">🇮🇳 Malayalam</option>
          <option value="mr-IN">🇮🇳 Marathi</option>
          <option value="gu-IN">🇮🇳 Gujarati</option>
          <option value="kn-IN">🇮🇳 Kannada</option>
          <option value="pa-IN">🇮🇳 Punjabi</option>
          <option value="ur-PK">🇵🇰 Urdu</option>
          <option value="es-ES">🇪🇸 Spanish</option>
          <option value="fr-FR">🇫🇷 French</option>
          <option value="de-DE">🇩🇪 German</option>
          <option value="it-IT">🇮🇹 Italian</option>
          <option value="pt-BR">🇧🇷 Portuguese</option>
          <option value="ru-RU">🇷🇺 Russian</option>
          <option value="nl-NL">🇳🇱 Dutch</option>
          <option value="tr-TR">🇹🇷 Turkish</option>
          <option value="pl-PL">🇵🇱 Polish</option>
          <option value="sv-SE">🇸🇪 Swedish</option>
          <option value="ja-JP">🇯🇵 Japanese</option>
          <option value="ko-KR">🇰🇷 Korean</option>
          <option value="zh-CN">🇨🇳 Chinese</option>
          <option value="th-TH">🇹🇭 Thai</option>
          <option value="vi-VN">🇻🇳 Vietnamese</option>
          <option value="id-ID">🇮🇩 Indonesian</option>
          <option value="ar-SA">🇸🇦 Arabic</option>
          <option value="he-IL">🇮🇱 Hebrew</option>
          <option value="fa-IR">🇮🇷 Persian</option>
        </select>
      </div>
    </div>

    <!-- ===== Mic + Visualizer ===== -->
    <div class="mic-container">
      <canvas id="visualizer" width="360" height="70"></canvas>

      <button id="micBtn" class="mic-btn" aria-label="Start listening">
        <svg id="micIcon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>

      <p class="mic-status" id="micStatus">Tap the mic to begin</p>
    </div>

    <!-- ===== Options Bar ===== -->
    <div class="options-bar">
      <label class="toggle-option">
        <input type="checkbox" id="autoPlayToggle" checked>
        <span class="toggle-label">Auto-play translation</span>
      </label>

      <label class="toggle-option">
        <input type="checkbox" id="echoGuardToggle" checked>
        <span class="toggle-label">Echo guard</span>
      </label>

      <div class="speed-control">
        <label for="speedRange">Speed</label>
        <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="1">
        <span id="speedValue">1.0×</span>
      </div>
    </div>

    <!-- ===== Panels ===== -->
    <div class="panels">
      <div class="panel">
        <div class="panel-header">
          <h2>Original</h2>
          <button class="copy-btn" id="copyOriginal" title="Copy original">📋</button>
        </div>
        <p id="originalText" class="text-box" data-placeholder="Your speech appears here..."></p>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Translation</h2>
          <button class="copy-btn" id="copyTranslation" title="Copy translation">📋</button>
        </div>
        <p id="translatedText" class="text-box" data-placeholder="Translation appears here..."></p>
      </div>
    </div>

    <!-- ===== Action Buttons ===== -->
    <div class="actions">
      <button id="playBtn" class="action-btn play" disabled>
        <span>🔊</span> Play Translation
      </button>
      <button id="historyBtn" class="action-btn history">
        <span>📜</span> History
        <span class="badge" id="historyBadge">0</span>
      </button>
    </div>

    <!-- ===== Footer / Copyright ===== -->
    <footer class="footer">
      <p>&copy; <span id="year"></span> LinguCast. All rights reserved.</p>
      <p class="footer-sub">Broadcast your voice worldwide</p>
    </footer>

  </div>

  <!-- ===== History Drawer ===== -->
  <div class="history-overlay" id="historyOverlay">
    <div class="history-panel">
      <div class="history-header">
        <h2>📜 Translation History</h2>
        <button class="close-btn" id="closeHistory">✕</button>
      </div>

      <div class="history-list" id="historyList">
        <p class="empty-history">No translations yet.</p>
      </div>

      <div class="history-actions">
        <button id="exportBtn" class="action-btn small">📥 Export JSON</button>
        <button id="clearHistoryBtn" class="action-btn small danger">🗑️ Clear All</button>
      </div>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
